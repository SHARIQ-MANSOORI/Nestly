name: Nestly CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Secret Pattern Scan
        run: |
          echo "Scanning codebase for accidentally committed secrets or tokens..."
          ! grep -rEi "(([a-zA-Z0-9_]{20,})|(AKIA[0-9A-Z]{16})|(eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}))" --exclude-dir={node_modules,.git,dist,coverage} --exclude={package-lock.json,*.md,*.log} .

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

      - name: Execute ESLint (Server & Client)
        run: npm run lint

  test:
    name: Automated Unit & Integration Testing
    runs-on: ubuntu-latest
    needs: lint-and-security

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://localhost:27017/nestly_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: nestly_ci_test_jwt_secret_key_2026_super_secure_hash
      COOKIE_NAME: nestly_token
      CLIENT_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Execute Server Unit & Integration Tests with Coverage
        run: npm run test:coverage

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  build:
    name: Frontend Production Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Vite Production Assets
        run: npm run build

      - name: Verify Build Output Existence
        run: test -d client/dist && test -f client/dist/index.html
