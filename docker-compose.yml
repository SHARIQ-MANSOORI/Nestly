name: nestly

services:
  # Database Service — MongoDB 7.0
  mongodb:
    image: mongo:7.0
    container_name: nestly-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nestly-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache Service — Redis 7.2 Alpine
  redis:
    image: redis:7.2-alpine
    container_name: nestly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nestly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Application Backend — Node.js Express API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nestly-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/nestly
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-nestly_jwt_secret_dev_key_2026_change_in_production}
      - COOKIE_NAME=${COOKIE_NAME:-nestly_token}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nestly-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Application Frontend — React SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nestly-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nestly-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  nestly-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
